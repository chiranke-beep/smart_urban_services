name: Node.js CI

on:
  push:
    branches: [ "main", "develop", "feature/backend" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend   # ← point to backend folder

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for errors (lint)
        run: node -e "require('./src/app.js')" || true

      - name: Run tests (if any)
        run: npm test --if-present
